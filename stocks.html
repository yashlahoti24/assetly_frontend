<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script> <!-- for icons -->
</head>
<body class="bg-light">

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 bg-white vh-100">
                <div class="card h-100">
                    <div class="card-body d-flex flex-column justify-content-between h-100">
                        <div>
                            <a href="/index.html">
                                <h3 class="text-primary">Assetly</h3>
                            </a>
                            <p>Hey User</p>

                            <button class="btn btn-primary w-100 mb-2" onclick="showAddForm()">
                                <i class="fas fa-plus"></i> Add Investment
                            </button>
                            <a href="/stocks.html">
                                <button class="btn btn-outline-success w-100 mb-2" onclick="showStocksChart()">
                                    <i class="fas fa-chart-line"></i> Stocks
                                </button>
                            </a>
                            <button class="btn btn-outline-warning w-100 mb-2" onclick="showGoldChart()">
                                <i class="fas fa-coins"></i> Gold
                            </button>
                            <a href="./history.html">
                                <button class="btn btn-outline-info w-100 mb-2" onclick="showHistory()">
                                    <i class="fas fa-history"></i> History
                                </button>
                            </a>
                            <a href="/portfolio.html">
                                <button class="btn btn-outline-secondary w-100 mb-3" onclick="showPortfolio()">
                                    <i class="fas fa-briefcase"></i> Portfolio
                                </button>
                            </a>
                        </div>
                        <div class="mt-4">
                            <a href="profile.html">
                                <button class="btn btn-outline-primary btn-sm w-100">
                                    <i class="fas fa-user-circle me-2"></i>Profile
                                </button>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 py-5">
                <h1 class="text-center mb-4">Stock Price Viewer</h1>
                <div class="row mb-4">
                    <div class="col-md-4">
                        <input type="text" id="symbol" class="form-control" placeholder="Enter Stock Symbol (e.g. AAPL)">
                    </div>
                    <div class="col-md-3">
                        <select id="timeframe" class="form-select">
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                            <option value="yearly">Yearly</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button onclick="getStockData()" class="btn btn-primary w-100">Get Stock Data</button>
                    </div>
                </div>

                <canvas id="stockChart" height="100"></canvas>
                <div id="stock-data" class="mb-4"></div>
            </div>
        </div>
    </div>

    <script src="stocks.js"></script>
</body>
</html>
